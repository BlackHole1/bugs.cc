name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node from .node-version, bun from package.json devEngines.packageManager.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      # `astro check` first: it generates .astro/ content types that `vp check` type-checks against.
      - name: Astro check
        run: vp run check

      # Format, lint, and type-aware lint with type checks (vite.config.ts `fmt` / `lint`).
      - name: Check
        run: vp check --deny-warnings

      - name: Markdown lint
        run: vp run lint:md

      - name: Tests
        run: vp test run

      # Fails when a PNG or JPEG under public/images/ has not been through `vpr img`.
      - name: Image check
        run: vp run img --check

      # `vp run build` is the Astro build script; the built-in `vp build` would run plain Vite.
      - name: Build
        run: vp run build
